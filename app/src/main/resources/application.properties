# Reduce logging level to make sure the application works with SAM local
# https://github.com/aws/serverless-java-container/issues/134
logging.level.root=INFO

aws.region=${AWS_REGION}

# Spring Secret Manager
spring.config.import=aws-secretsmanager:${SECRET_NAME}?prefix=jwt.


# Feature Flags
app.create-users.enabled=${FF_CREATE_USERS:false}